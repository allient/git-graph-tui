name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy + unused deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo lint
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  test:
    name: test
    # Linux only: macOS runners queue for minutes; macOS is covered by local development.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Configure git identity for fixture repos
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - run: cargo nextest run --workspace --locked --profile ci
      - run: cargo test --workspace --doc --locked

  release-targets:
    name: type-check ${{ matrix.target }}
    # TLS uses native code, so compile it with each platform's native toolchain.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked --target ${{ matrix.target }}

  herdr-plugin:
    name: herdr plugin scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Ubuntu's sh is dash, the strictest POSIX shell the scripts target.
      - run: sh integrations/herdr/tests/run.sh

  deny:
    name: cargo-deny (licenses, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check
