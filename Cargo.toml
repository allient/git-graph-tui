[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/allient/tui-git-graph"
homepage = "https://github.com/allient/tui-git-graph"
authors = ["Allient"]
publish = false

# Every version lives here. Member crates use `dep.workspace = true` so the
# whole workspace stays on one version of each dependency.
[workspace.dependencies]
# Internal crates
tgg-model = { path = "crates/model" }
tgg-git = { path = "crates/git" }
tgg-graph = { path = "crates/graph" }
tgg-actions = { path = "crates/actions" }
tgg-ui = { path = "crates/ui" }
tgg-testkit = { path = "crates/testkit" }

# TUI
ratatui = "0.30.2"
crossterm = "0.29.0"
unicode-width = "0.2.3"

# App plumbing
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

# Errors and diagnostics
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Testing
insta = "1.49.0"
pretty_assertions = "1.4.1"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that cost more than they give in this codebase.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Keep panics and leftovers out of non-test code (tests are allowed via clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.dev.package."*"]
# Dependencies are compiled with optimizations so the TUI stays responsive in debug builds.
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
