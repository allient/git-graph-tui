# herdr plugin for tui-git-graph: opens the Git Graph for the active
# repository in a herdr tab, with plain right-click going to its menus.
id = "tui-git-graph"
name = "tui-git-graph"
version = "0.1.0"
description = "A Git Graph for the terminal: the commit graph with right-click menus, in a herdr tab."
# The version these scripts were checked against (`pane input --right-click`,
# `plugin pane open --env`).
min_herdr_version = "0.9.5"
platforms = ["linux", "macos"]

# Actions run headless; open.sh hands over to the `graph` pane below.
[[actions]]
id = "open"
title = "Open Git Graph"
description = "Open tui-git-graph for the active worktree, the focused pane's directory or the workspace."
contexts = ["workspace"]
command = ["sh", "scripts/open.sh"]

[[panes]]
id = "graph"
title = "Git Graph"
placement = "tab"
command = ["sh", "scripts/run.sh"]
